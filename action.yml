name: 'runs-on/action'
description: 'RunsOn Action for magic caching, and more'
runs:
  using: 'node24'
  main: 'index.js'
  post: 'post.js'

inputs:
  show_env:
    description: 'Show all environment variables'
    required: false
    default: 'false'
  show_costs:
    description: 'Control how execution costs are displayed: "inline" for log output, "summary" for GitHub job summary, any other value disables the feature'
    required: false
    default: 'inline'
  metrics:
    description: 'Comma separated list of additional metrics to send to CloudWatch (cpu, network, memory, disk, io)'
    required: false
    default: ''
  network_interface:
    description: 'Network interface to monitor'
    required: false
    default: 'enp39s0'
  disk_device:
    description: 'Disk device to monitor'
    required: false
    default: 'nvme0n1p1'
  sccache:
    description: 'Enable sccache. Can take either "s3" (RunsOn S3 cache bucket) or be empty (disabled). You still need to setup sccache in your workflow, for instance with mozilla-actions/sccache-action.'
    required: false
    default: ''
  cache:
    description: 'Newline/comma separated list of cache modes to persist on the sticky disk (go, node, yarn, pnpm, ruby, rust, python, uv, poetry, apt, buildkit, gradle, maven, playwright). Requires a snap=<size>[:<name>] label on the job. Linux and Windows (apt and buildkit modes are Linux only). Run this action after actions/checkout when caching workspace-relative paths.'
    required: false
    default: ''
  path:
    description: 'Newline separated list of arbitrary paths to persist on the sticky disk. Requires a snap=<size>[:<name>] label on the job. Linux and Windows.'
    required: false
    default: ''
  wait_timeout:
    description: 'How long to wait for the sticky disk to be ready (Go duration, e.g. "5m")'
    required: false
    default: '5m'
  fail_on_missing:
    description: 'Fail the step if no sticky disk is available (no snap= label, or not ready before wait_timeout)'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Set to "true" when every requested cache path was restored from a previous snapshot, "false" otherwise'