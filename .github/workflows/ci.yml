name: CI

# Scratch branch: builds the action and benchmarks Gradle caching setups on
# android/nowinandroid. Not for merging.
on:
  push:
    branches:
      - bench/gradle-build-cache
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPX_VERSION: 5.0.2
    steps:
      - uses: actions/checkout@v6
      - if: ${{ !startsWith(github.ref_name, 'v') }}
        uses: ./.github/actions/reject-build-output
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install UPX
        shell: bash
        run: |
          set -euo pipefail
          upx_archive="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          curl -fsSL \
            -o "${RUNNER_TEMP}/${upx_archive}" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${upx_archive}"
          tar -xJf "${RUNNER_TEMP}/${upx_archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/upx-${UPX_VERSION}-amd64_linux" >> "${GITHUB_PATH}"
      - name: Build
        run: make build
      # A tarball keeps the binaries' executable bit, which artifacts drop.
      - name: Package
        run: tar -cf dist.tar main-linux-amd64 main-linux-arm64 main-windows-amd64.exe index.js post.js
      # Artifacts belong to this run, so every run has its own "dist". A
      # re-run of all jobs replaces it instead of failing on the name.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar
          if-no-files-found: error
          overwrite: true

  cold:
    needs: build
    uses: ./.github/workflows/bench-gradle.yml
    with:
      phase: cold
  warm:
    needs: cold
    uses: ./.github/workflows/bench-gradle.yml
    with:
      phase: warm
  edit:
    needs: cold
    uses: ./.github/workflows/bench-gradle.yml
    with:
      phase: edit
