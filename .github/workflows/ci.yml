name: CI

# Scratch branch: builds the action and benchmarks sccache: true against
# sccache: s3 (runs-on/action#78). Not for merging.
on:
  push:
    branches:
      - bench/sccache-magic-cache

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPX_VERSION: 5.0.2
    steps:
      - uses: actions/checkout@v6
      - if: ${{ !startsWith(github.ref_name, 'v') }}
        uses: ./.github/actions/reject-build-output
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install UPX
        shell: bash
        run: |
          set -euo pipefail
          upx_archive="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          curl -fsSL \
            -o "${RUNNER_TEMP}/${upx_archive}" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${upx_archive}"
          tar -xJf "${RUNNER_TEMP}/${upx_archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/upx-${UPX_VERSION}-amd64_linux" >> "${GITHUB_PATH}"
      - name: Build
        run: make build
      # A tarball keeps the binaries' executable bit, which artifacts drop.
      - name: Package
        run: tar -cf dist.tar main-linux-amd64 main-linux-arm64 main-windows-amd64.exe index.js post.js
      # Artifacts belong to this run, so every run has its own "dist". A
      # re-run of all jobs replaces it instead of failing on the name.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar
          if-no-files-found: error
          overwrite: true

  cold:
    name: cold ${{ matrix.mode }} ${{ matrix.rep }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        mode: [s3, "true"]
        rep: [1, 2]
    runs-on: runs-on=${{ github.run_id }}/env=bootstrap/family=c7a.8xlarge/image=ubuntu24-full-x64/extras=s3-cache/spot=false
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_VERSION: bench-${{ github.run_id }}-${{ matrix.mode }}-${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/use-dist
      - uses: ./.github/actions/bench-sccache
        with:
          mode: ${{ matrix.mode }}
          phase: cold
          ns: ${{ github.run_id }}-${{ matrix.mode }}-${{ matrix.rep }}

  warm:
    name: warm ${{ matrix.mode }} ${{ matrix.rep }}
    needs: cold
    strategy:
      fail-fast: false
      matrix:
        mode: [s3, "true"]
        rep: [1, 2]
    runs-on: runs-on=${{ github.run_id }}/env=bootstrap/family=c7a.8xlarge/image=ubuntu24-full-x64/extras=s3-cache/spot=false
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_VERSION: bench-${{ github.run_id }}-${{ matrix.mode }}-${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/use-dist
      - uses: ./.github/actions/bench-sccache
        with:
          mode: ${{ matrix.mode }}
          phase: warm
          ns: ${{ github.run_id }}-${{ matrix.mode }}-${{ matrix.rep }}
