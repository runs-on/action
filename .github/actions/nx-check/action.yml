name: Check Nx
description: Runs a two-project Nx workspace through the RunsOn agent's Nx cache, and checks what went to and came from Magic Cache.

inputs:
  workspace:
    description: Identifies the workspace's content, so its task hashes are the run's own. The job that uploads and the job that restores pass the same value.
    required: true
  uploads:
    description: '"true" in the job that runs and uploads, "false" in a later job that restores every task.'
    default: 'true'

runs:
  using: composite
  steps:
    - id: tools
      uses: ./.github/actions/tool-caches-served
      with:
        protocol: nx
    # An agent without the nx protocol: runs-on/action warns and leaves Nx
    # alone.
    - name: Without the nx protocol, NX_SELF_HOSTED_REMOTE_CACHE_SERVER is not set
      if: steps.tools.outputs.served != 'true'
      shell: bash
      run: |
        if [[ -n "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER:-}" ]]; then
          echo "::error::NX_SELF_HOSTED_REMOTE_CACHE_SERVER is set on an agent without the nx protocol"
          exit 1
        fi
    # GitHub gives the job's runtime token to actions only. Nx gets a URL that
    # stands for it.
    - name: Nx gets the agent's cache, and no runtime token
      if: steps.tools.outputs.served == 'true'
      shell: bash
      run: |
        if [[ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
          echo "::error::the runtime token is in the environment of the job's run steps"
          exit 1
        fi
        if [[ "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER:-}" != http://*/nx ]]; then
          echo "::error::NX_SELF_HOSTED_REMOTE_CACHE_SERVER is '${NX_SELF_HOSTED_REMOTE_CACHE_SERVER:-}', want the agent's Nx cache"
          exit 1
        fi
    - name: Create a workspace
      if: steps.tools.outputs.served == 'true'
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/nx-check"
        rm -rf "${dir}"
        mkdir -p "${dir}/packages/lib" "${dir}/packages/app"
        cd "${dir}"
        printf '{"name":"nx-check","private":true,"devDependencies":{"nx":"24.0.4"}}\n' > package.json
        printf '{"targetDefaults":{"build":{"cache":true,"dependsOn":["^build"],"outputs":["{projectRoot}/dist"]}}}\n' > nx.json
        printf 'node_modules\ndist\n.nx\n' > .gitignore
        printf '%s\n' "${WORKSPACE}" > packages/lib/seed.txt
        # Each build copies a file into its project's dist.
        printf 'const fs = require("fs");\nfs.mkdirSync("dist", { recursive: true });\nfs.copyFileSync(process.argv[2], "dist/out.txt");\n' > copy.js
        printf '{"name":"lib","targets":{"build":{"command":"node ../../copy.js seed.txt","options":{"cwd":"packages/lib"}}}}\n' > packages/lib/project.json
        printf '{"name":"app","implicitDependencies":["lib"],"targets":{"build":{"command":"node ../../copy.js ../lib/dist/out.txt","options":{"cwd":"packages/app"}}}}\n' > packages/app/project.json
        npm install --no-audit --no-fund --loglevel=error
    - name: Run through Nx
      if: steps.tools.outputs.served == 'true'
      shell: bash
      env:
        UPLOADS: ${{ inputs.uploads }}
        WORKSPACE: ${{ inputs.workspace }}
        # A local cache of its own, so a hit can only come from the agent.
        NX_CACHE_DIRECTORY: ${{ runner.temp }}/nx-check-cache
        NX_DAEMON: 'false'
        NX_NO_CLOUD: 'true'
      run: |
        set -euo pipefail
        cd "${RUNNER_TEMP}/nx-check"
        rm -rf "${NX_CACHE_DIRECTORY}"
        npx nx run-many -t build --outputStyle=static 2>&1 | tee build.log
        if [[ "${UPLOADS}" != true ]] && ! grep -q 'for 2 out of 2 tasks' build.log; then
          echo "::error::Nx did not restore every task from the agent's cache"
          exit 1
        fi
        test "$(tr -d '\r' < packages/app/dist/out.txt)" = "${WORKSPACE}"
    - name: Check what went through the agent
      if: steps.tools.outputs.served == 'true'
      shell: bash
      env:
        UPLOADS: ${{ inputs.uploads }}
      run: |
        set -euo pipefail
        cache_url="${RUNS_ON_MAGIC_CACHE_URL:-${ACTIONS_RESULTS_URL}}"
        diagnostics=$(curl -fsS "${cache_url%/}/_runs-on/diagnostics")
        count() { { grep -o "\"operation\":\"$1\",\"key\":\"[^\"]*\",\"objectKey\":\"[^\"]*\",\"version\":\"nx\"" <<<"${diagnostics}" || true; } | wc -l | tr -d ' '; }
        reads=$(count read)
        writes=$(count write)
        echo "Nx reads: ${reads}, writes: ${writes}"
        if [[ "${UPLOADS}" == true && "${writes}" != 2 ]]; then
          echo "::error::Nx uploaded ${writes} entries through the agent, want 2"
          exit 1
        fi
        if [[ "${UPLOADS}" != true && "${reads}" != 2 ]]; then
          echo "::error::Nx restored ${reads} entries through the agent, want 2"
          exit 1
        fi
