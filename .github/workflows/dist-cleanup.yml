name: Dist cleanup

# Deletes the dist/<branch> mirror that ci.yml publishes when its branch is
# deleted. Branch deletions made with GITHUB_TOKEN do not trigger this.
on:
  delete:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && !startsWith(github.event.ref, 'dist/')
    runs-on: ubuntu-latest
    concurrency:
      group: dist-mirror-${{ github.event.ref }}
      cancel-in-progress: false
    steps:
      - name: Delete dist/${{ github.event.ref }}
        shell: bash
        env:
          BRANCH: ${{ github.event.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "${BRANCH} exists again; keeping its mirror."
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dist/${BRANCH}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/dist/${BRANCH}"
            echo "Deleted dist/${BRANCH}."
          fi
