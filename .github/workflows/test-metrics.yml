name: Test / Metrics
on:
  push:
    branches:
      - main
      - v*
      - feature/*
      - fix/*
  workflow_dispatch:

jobs:
  metrics:
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu24-full-x64, ubuntu24-full-arm64]
        configuration: ["existing-aws-creds", "no-aws-creds", "cw-agent-stopped"]
    runs-on: runs-on=${{ github.run_id }}/cpu=2/family=m7/image=${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6
      - name: configure aws credentials
        if: matrix.configuration == 'existing-aws-creds'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::756351362063:role/github-oidc
          role-session-name: test
          aws-region: ${{ env.RUNS_ON_AWS_REGION }}
      - name: Stop CloudWatch agent
        if: matrix.configuration == 'cw-agent-stopped'
        run: sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a stop || true
      - uses: ./
        id: runs_on
        with:
          metrics: cpu,network,memory,disk,io
      - name: Setup
        run: sudo apt-get update && sudo apt-get install -y stress-ng
      - name: Generate load
        run: |
          # CPU intensive - variable load
          for i in {1..10}; do
            dd if=/dev/zero bs=1M count=$((RANDOM % 100 + 150)) | md5sum &
            sleep 10
          done &
          
          # Memory intensive - variable load
          for i in {1..10}; do
            stress-ng --vm $((RANDOM % 4 + 1)) --vm-bytes $((RANDOM % 512 + 256))M --timeout 10s &
            sleep 10
          done &
          
          # Disk intensive - variable load
          for i in {1..10}; do
            dd if=/dev/urandom of=/tmp/testfile$i bs=1M count=$((RANDOM % 100 + 150)) &
            sleep 10
          done &
          
          wait
      - name: Verify VolumeId disk metric
        env:
          VOLUME_ID: ${{ steps.runs_on.outputs.volume_id }}
        run: |
          set -euo pipefail

          if [[ -z "$VOLUME_ID" ]]; then
            echo "::error::The action did not resolve an EBS VolumeId"
            exit 1
          fi

          # Match the action's credential isolation so preconfigured workflow credentials cannot query a different account.
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_DEFAULT_PROFILE
          unset AWS_WEB_IDENTITY_TOKEN_FILE AWS_ROLE_ARN AWS_ROLE_SESSION_NAME AWS_EC2_METADATA_DISABLED

          metric_queries=$(jq -nc \
            --arg instance_id "$RUNS_ON_INSTANCE_ID" \
            --arg volume_id "$VOLUME_ID" \
            '[{
              Id: "diskused",
              MetricStat: {
                Metric: {
                  Namespace: "CWAgent",
                  MetricName: "disk_used_percent",
                  Dimensions: [
                    {Name: "InstanceId", Value: $instance_id},
                    {Name: "VolumeId", Value: $volume_id},
                    {Name: "fstype", Value: "ext4"},
                    {Name: "path", Value: "/"}
                  ]
                },
                Period: 10,
                Stat: "Average"
              },
              ReturnData: true
            }]')

          for attempt in {1..6}; do
            start_time=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            end_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if value_count=$(aws cloudwatch get-metric-data \
              --region "$RUNS_ON_AWS_REGION" \
              --metric-data-queries "$metric_queries" \
              --start-time "$start_time" \
              --end-time "$end_time" \
              --query 'length(MetricDataResults[0].Values)' \
              --output text); then
              if [[ "$value_count" =~ ^[1-9][0-9]*$ ]]; then
                echo "Verified disk_used_percent for $VOLUME_ID ($value_count datapoints)"
                exit 0
              fi
            fi

            if [[ "$attempt" -lt 6 ]]; then
              sleep 10
            fi
          done

          echo "::error::No VolumeId-qualified disk_used_percent datapoints were published for $VOLUME_ID"
          while IFS= read -r config_file; do
            echo "CloudWatch configuration: $config_file"
            cat "$config_file"
          done < <(find /tmp "$RUNNER_TEMP" -maxdepth 2 -type f -name 'runs-on-metrics-*.json' 2>/dev/null)
          aws cloudwatch list-metrics \
            --region "$RUNS_ON_AWS_REGION" \
            --namespace CWAgent \
            --metric-name disk_used_percent \
            --dimensions Name=InstanceId,Value="$RUNS_ON_INSTANCE_ID" || true
          exit 1
