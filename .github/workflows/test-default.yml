name: Test / Default
on:
  push:
    branches:
      - main
      - v*
      - feature/*
      - fix/*
  workflow_dispatch:

jobs:
  github:
    name: GitHub runners
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go for Windows unit tests
        if: runner.os == 'Windows'
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Windows sticky-cache unit tests
        if: runner.os == 'Windows'
        run: go test ./internal/stickydisk
      # expectation: this is just a noop on managed runners
      - uses: ./
      - run: sleep 30

  runs-on:
    name: RunsOn runners
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu24-full-x64, ubuntu24-full-arm64, windows25-full-x64]
    runs-on: runs-on=${{ github.run_id }}/env=bootstrap/cpu=2/family=m7/image=${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go for Windows unit tests
        if: runner.os == 'Windows'
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Windows sticky-cache unit tests
        if: runner.os == 'Windows'
        run: go test ./internal/stickydisk
      - uses: ./
      - run: sleep 30
